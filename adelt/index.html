<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mono design · тестовое adelt.io</title>
<link rel="preload" as="image" href="assets/win-c-off.webp">
<link rel="preload" as="image" href="assets/win-c-on.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #FEFEFE;              /* белый экран загрузки, потом его закрывает город */
    --ink: #3A3A3A;
    --font: "HelveticaNeueCyr", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --u: min(1vh, 0.62vw);       /* единица размера окна, десктоп */
  }
  @media (orientation: portrait) { :root { --u: min(1vh, 1.5vw); } }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--sky); }

  /* город стоит под экраном и выезжает снизу */
  .city { position: fixed; inset: 0; transform: translateY(100%); }
  .city img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 100%; display: block; }

  /* окна вырезаны с прозрачностью (свечение вокруг рамы полупрозрачное), поэтому лежат поверх любого неба */
  .sky { position: absolute; inset: 0; }
  .win { position: absolute; translate: -50% -50%; aspect-ratio: 658 / 1100; height: calc(var(--h) * var(--u)); }
  .win.a, .win.b { aspect-ratio: 403 / 700; }
  .win .float { position: absolute; inset: 0; }
  .win img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .win.clone { opacity: 0; }
  .win.main { opacity: 0; }
  .win.main .on { opacity: 0; }

  /* после сборки окна чуть покачиваются, каждое в своём ритме */
  .idle .win .float { animation: bob var(--bob, 7s) ease-in-out infinite alternate; }
  @keyframes bob { from { transform: translateY(calc(var(--u) * -0.35)); } to { transform: translateY(calc(var(--u) * 0.35)); } }

  /* подпись по центру экрана, как wordmark у bybang */
  .wordmark { position: fixed; z-index: 7; left: 50%; top: 50%; translate: -50% -50%; font: 500 clamp(36px, 3.34vw, 96px)/1 "Inter Tight", var(--font); color: #F5F8FF; white-space: nowrap; opacity: 0; pointer-events: none; }

  .counter { position: fixed; z-index: 6; left: 50%; translate: -50% 0; font: 400 13px/1 var(--font); letter-spacing: 0.12em; color: var(--ink); font-variant-numeric: tabular-nums; transition: opacity 0.4s; }
  .counter.hide { opacity: 0; }

  @media (prefers-reduced-motion: reduce) { .idle .win .float { animation: none; } }
</style>
</head>
<body>
<div class="city"><img src="assets/city-night.jpg" alt="Вечерний город у залива в синий час"></div>
<div class="sky" id="sky"></div>
<h1 class="wordmark" id="wordmark">Mono design</h1>
<div class="counter" id="counter">0</div>

<script>
// Раскладка как на картине-референсе: крупные окна ниже и ближе, мелкие выше и дальше.
// [x в % ширины, y в % высоты, высота в единицах --u, форма]
const LAYOUT = [
  [12, 40, 22, 'c'], [30, 44, 20, 'b'], [70, 42, 23, 'c'], [88, 40, 20, 'a'],
  [6, 24, 13, 'a'], [22, 26, 14, 'c'], [38, 27, 12, 'c'], [62, 24, 12, 'b'], [80, 26, 14, 'c'], [95, 22, 12, 'c'],
  [10, 9, 7, 'c'], [18, 14, 6, 'b'], [33, 11, 8, 'c'], [46, 8, 6, 'c'], [57, 13, 7, 'b'], [68, 9, 8, 'a'], [77, 14, 6, 'c'], [90, 10, 7, 'c'],
  [26, 4, 4, 'c'], [62, 4, 3, 'c'], [84, 5, 3, 'b'],
];
const MAIN = [50, 34, 18];   // куда встаёт главное окно после разлёта
const START_H = 46;          // высота главного окна на загрузке, в --u
const EASE = 'cubic-bezier(0.16, 1, 0.3, 1)';

const sky = document.getElementById('sky');
const counter = document.getElementById('counter');
const city = document.querySelector('.city');
const wordmark = document.getElementById('wordmark');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

function makeWin([x, y, h, type], cls) {
  const el = document.createElement('div');
  el.className = `win ${type} ${cls}`;
  el.style.left = x + '%'; el.style.top = y + '%'; el.style.setProperty('--h', h);
  el.style.setProperty('--bob', (5 + Math.random() * 4).toFixed(1) + 's');
  const f = document.createElement('div'); f.className = 'float';
  f.innerHTML = cls === 'main'
    ? '<img class="off" src="assets/win-c-off.webp" alt=""><img class="on" src="assets/win-c-on.webp" alt="">'
    : `<img src="assets/win-${type}-on.webp" alt="">`;
  el.append(f); sky.append(el); return el;
}
const clones = LAYOUT.map(p => makeWin(p, 'clone'));
const main = makeWin([...MAIN, 'c'], 'main');

// трансформация, которая ставит окно в центр экрана в размер главного окна на загрузке
function unit() { return Math.min(innerHeight / 100, innerWidth * (matchMedia('(orientation: portrait)').matches ? 0.015 : 0.0062)); }
function centerTransform(el) {
  const r = el.getBoundingClientRect();
  const s = START_H * unit() / r.height;
  return `translate(${innerWidth / 2 - (r.left + r.width / 2)}px, ${innerHeight / 2 - (r.top + r.height / 2)}px) scale(${s})`;
}
const wait = ms => new Promise(r => setTimeout(r, ms));

async function run() {
  await Promise.all([...document.images].map(i => i.decode().catch(() => {})));

  if (reduce) {
    clones.forEach(c => c.style.opacity = 1); main.style.opacity = 1;
    main.querySelector('.on').style.opacity = 1; main.querySelector('.off').style.opacity = 0; city.style.transform = 'none'; wordmark.style.opacity = 1;
    counter.remove(); return;
  }

  // 1. загрузка: главное окно по центру, свет выключен, идёт счётчик
  const mainStart = centerTransform(main);
  main.style.transform = mainStart;
  main.style.opacity = 1;
  main.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 700, easing: 'ease-out' });
  counter.style.top = (innerHeight / 2 + START_H * unit() / 2 + 28) + 'px';

  const LOAD = 2400, t0 = performance.now();
  await new Promise(done => {
    (function tick(now) {
      const p = Math.min(1, (now - t0) / LOAD);
      counter.textContent = Math.round(100 * (1 - Math.pow(1 - p, 2.2)));
      p < 1 ? requestAnimationFrame(tick) : done();
    })(t0);
  });
  await wait(250);
  counter.classList.add('hide');

  // 2. свет загорается: короткое мерцание, как у лампы, потом ровный свет
  const FLICKER = [0, 0.7, 0.05, 0.85, 0.25, 1], OFFS = [0, 0.12, 0.22, 0.45, 0.58, 1];
  const flick = { duration: 900, easing: 'linear', fill: 'forwards' };
  main.querySelector('.off').animate(FLICKER.map((o, i) => ({ opacity: 1 - o, offset: OFFS[i] })), flick);
  await main.querySelector('.on').animate(FLICKER.map((o, i) => ({ opacity: o, offset: OFFS[i] })), flick).finished;
  await wait(350);

  // 3. окно распадается: копии вылетают из главного и расходятся по небу
  clones.forEach(c => {
    const from = centerTransform(c);
    c.animate(
      [{ transform: from, opacity: c.classList.contains('c') ? 1 : 0 }, { opacity: 1, offset: 0.25 }, { transform: 'none', opacity: 1 }],
      { duration: 1700, delay: 40 + Math.random() * 260, easing: EASE, fill: 'forwards' });
  });
  main.animate([{ transform: mainStart }, { transform: 'none' }], { duration: 1700, easing: EASE, fill: 'forwards' })
    .finished.then(() => { main.style.transform = 'none'; });

  // 4. город выезжает снизу и встаёт на место с лёгкой отдачей
  await wait(500);
  await city.animate(
    [{ transform: 'translateY(100%)' }, { transform: 'translateY(-1.2%)', offset: 0.78 }, { transform: 'translateY(0)' }],
    { duration: 1600, easing: 'cubic-bezier(0.22, 1, 0.36, 1)', fill: 'forwards' }).finished;

  // 5. подпись проявляется по центру
  wordmark.animate([{ opacity: 0, transform: 'translateY(12px)' }, { opacity: 1, transform: 'none' }], { duration: 900, easing: EASE, fill: 'forwards' });
  document.body.classList.add('idle');
}
run();
</script>
</body>
</html>
