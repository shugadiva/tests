<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mono design · тестовое adelt.io</title>
<link rel="preload" as="image" href="assets/win-c-off.webp">
<link rel="preload" as="image" href="assets/win-c-on.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&family=Inter+Tight:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #FEFEFE;              /* белый экран загрузки, потом его закрывает город */
    --ink: #3A3A3A;
    --font: "HelveticaNeueCyr", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --u: min(1vh, 0.62vw);       /* единица размера окна, десктоп */
  }
  @media (orientation: portrait) { :root { --u: min(1vh, 1.5vw); } }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--sky); overscroll-behavior: none; touch-action: none; }

  /* город стоит под экраном и выезжает снизу */
  .city { position: fixed; inset: 0; transform: translateY(100%); }
  .city img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 100%; display: block; }

  /* окна вырезаны с прозрачностью (свечение вокруг рамы полупрозрачное), поэтому лежат поверх любого неба */
  .sky { position: absolute; inset: 0; }
  /* лента окон: два одинаковых набора подряд, по прокрутке едет влево-вправо по кругу */
  .rail { position: absolute; inset: 0; will-change: transform; }
  /* холст искажения поверх ленты: когда он рисует окна, сами картинки прячем */
  .warp { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .gl .rail .win img { visibility: hidden; }
  .win { position: absolute; translate: -50% -50%; aspect-ratio: var(--ar); height: calc(var(--h) * var(--u)); }
  .win .float { position: absolute; inset: 0; }
  .win img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .win.clone { opacity: 0; }
  .win.main { opacity: 0; }
  .win.main .on { opacity: 0; }

  /* после сборки окна чуть покачиваются, каждое в своём ритме */
  .idle .win .float { animation: bob var(--bob, 7s) ease-in-out infinite alternate; }
  @keyframes bob { from { transform: translateY(calc(var(--u) * -0.35)); } to { transform: translateY(calc(var(--u) * 0.35)); } }

  /* подпись по центру экрана, как wordmark у bybang */
  .wordmark { position: fixed; z-index: 7; left: 50%; top: 50%; translate: -50% -50%; font: 500 clamp(36px, 3.34vw, 96px)/1 "Inter Tight", var(--font); color: #F5F8FF; white-space: nowrap; opacity: 0; pointer-events: none; }

  .counter { position: fixed; z-index: 6; left: 50%; translate: -50% 0; font: 500 13px/16px "Inter", var(--font); letter-spacing: 0.12em; color: var(--ink); font-variant-numeric: tabular-nums; transition: opacity 0.4s; }
  .counter.hide { opacity: 0; }

  @media (prefers-reduced-motion: reduce) { .idle .win .float { animation: none; } }
</style>
</head>
<body>
<div class="city"><img src="assets/city-night.jpg" alt="Вечерний город у залива в синий час"></div>
<div class="sky" id="sky"><div class="rail" id="rail"></div><canvas class="warp" id="warp" aria-hidden="true"></canvas></div>
<h1 class="wordmark" id="wordmark">Mono design</h1>
<div class="counter" id="counter">0</div>

<script>
// Финал по макету 4041:5 (1920×1080): четыре окна вокруг подписи.
// [центр x в % ширины, центр y в % высоты, высота в --u (1080 = 100), окно, ширина/высота рамки в макете]
const WINDOWS = {
  shutters: 'win-shutters-on.webp', arch: 'win-arch-on.webp', tiles: 'win-tiles-on.webp',
};
const LAYOUT = matchMedia('(orientation: portrait)').matches
  ? [ // телефон: макета нет, два окна сверху и два снизу, подпись в просвете
      [27, 20, 31.48, 'shutters', '300 / 340'], [74, 25, 31.20, 'arch', '300 / 337'],
      [26, 76, 36.48, 'tiles', '270 / 394'], [73, 81, 31.48, 'shutters', '300 / 340'],
    ]
  : [
      [32.66, 22.69, 31.48, 'shutters', '300 / 340'], [80.42, 24.49, 31.20, 'arch', '300 / 337'],
      [14.53, 68.24, 36.48, 'tiles', '270 / 394'], [68.80, 77.41, 31.48, 'shutters', '300 / 340'],
    ];
const START_H = 30.93;       // высота главного окна на загрузке, в --u: в макете 4041:2 окно 200×334 на 1080 по высоте
const EASE = 'cubic-bezier(0.16, 1, 0.3, 1)';

const sky = document.getElementById('sky');
const rail = document.getElementById('rail');
const counter = document.getElementById('counter');
const city = document.querySelector('.city');
const wordmark = document.getElementById('wordmark');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

function makeWin([x, y, h, type, ar], cls, parent = rail) {
  const el = document.createElement('div');
  el.className = `win ${type} ${cls}`;
  el.style.left = x + '%'; el.style.top = y + '%'; el.style.setProperty('--h', h); el.style.setProperty('--ar', ar);
  el.style.setProperty('--bob', (5 + Math.random() * 4).toFixed(1) + 's');
  const f = document.createElement('div'); f.className = 'float';
  f.innerHTML = cls === 'main'
    ? '<img class="off" src="assets/win-c-off.webp" alt=""><img class="on" src="assets/win-c-on.webp" alt="">'
    : `<img src="assets/${WINDOWS[type]}" alt="">`;
  el.append(f); parent.append(el); return el;
}
const clones = LAYOUT.map(p => makeWin(p, 'clone'));
LAYOUT.forEach(([x, ...rest]) => makeWin([x + 100, ...rest], 'copy'));   // второй набор правее экрана, для бесшовного круга
const main = makeWin([50, 50, START_H, 'c', '658 / 1100'], 'main', sky);

// трансформация, которая ставит окно в центр экрана в размер главного окна на загрузке
function unit() { return Math.min(innerHeight / 100, innerWidth * (matchMedia('(orientation: portrait)').matches ? 0.015 : 0.0062)); }
function centerTransform(el) {
  const r = el.getBoundingClientRect();
  const s = START_H * unit() / r.height;
  return `translate(${innerWidth / 2 - (r.left + r.width / 2)}px, ${innerHeight / 2 - (r.top + r.height / 2)}px) scale(${s})`;
}
const wait = ms => new Promise(r => setTimeout(r, ms));

async function run() {
  await Promise.all([...document.images].map(i => i.decode().catch(() => {})));

  if (reduce) {
    clones.forEach(c => c.style.opacity = 1);
    city.style.transform = 'none'; wordmark.style.opacity = 1;
    counter.remove(); main.remove(); startScroll(); return;
  }

  // 1. загрузка: главное окно по центру, свет выключен, идёт счётчик
  main.style.opacity = 1;
  main.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 700, easing: 'ease-out' });
  counter.style.top = (innerHeight / 2 + START_H * unit() / 2 + 14) + 'px';   // зазор 14, как в макете

  const LOAD = 2400, t0 = performance.now();
  await new Promise(done => {
    (function tick(now) {
      const p = Math.min(1, (now - t0) / LOAD);
      counter.textContent = Math.round(100 * (1 - Math.pow(1 - p, 2.2)));
      p < 1 ? requestAnimationFrame(tick) : done();
    })(t0);
  });
  await wait(250);
  counter.classList.add('hide');

  // 2. свет загорается: короткое мерцание, как у лампы, потом ровный свет
  const FLICKER = [0, 0.7, 0.05, 0.85, 0.25, 1], OFFS = [0, 0.12, 0.22, 0.45, 0.58, 1];
  const flick = { duration: 900, easing: 'linear', fill: 'forwards' };
  main.querySelector('.off').animate(FLICKER.map((o, i) => ({ opacity: 1 - o, offset: OFFS[i] })), flick);
  await main.querySelector('.on').animate(FLICKER.map((o, i) => ({ opacity: o, offset: OFFS[i] })), flick).finished;
  await wait(350);

  // 3. окно распадается: из главного вылетают четыре окна финала и расходятся по небу, главное гаснет
  clones.forEach(c => {
    const from = centerTransform(c);
    c.animate(
      [{ transform: from, opacity: 0 }, { opacity: 1, offset: 0.2 }, { transform: 'none', opacity: 1 }],
      { duration: 1700, delay: 40 + Math.random() * 260, easing: EASE, fill: 'forwards' });
  });
  main.animate([{ opacity: 1, transform: 'scale(1)' }, { opacity: 0, transform: 'scale(0.92)' }], { duration: 500, easing: 'ease-out', fill: 'forwards' })
    .finished.then(() => main.remove());

  // 4. город выезжает снизу и встаёт на место с лёгкой отдачей
  await wait(500);
  await city.animate(
    [{ transform: 'translateY(100%)' }, { transform: 'translateY(-1.2%)', offset: 0.78 }, { transform: 'translateY(0)' }],
    { duration: 1600, easing: 'cubic-bezier(0.22, 1, 0.36, 1)', fill: 'forwards' }).finished;

  // 5. подпись проявляется по центру
  wordmark.animate([{ opacity: 0, transform: 'translateY(12px)' }, { opacity: 1, transform: 'none' }], { duration: 900, easing: EASE, fill: 'forwards' });
  document.body.classList.add('idle');
  startScroll();
}
run();

// ── Горизонтальный скролл и искажение, повтор bybang.co (их модуль ScrollImageDistortion) ──
// Механика у них: плавный скролл Lenis, окна рисует один WebGL-холст на весь экран.
// Изгиб считается в координатах экрана, а не картинки, поэтому у кромки экрана края окон
// выгибаются к зрителю; сила изгиба = скорость прокрутки. У них скролл вертикальный и гнётся
// по верху и низу экрана, у нас горизонтальный, поэтому оси повёрнуты: гнётся у левого и правого края.
const SNOISE = `
// 2D simplex noise by Ian McEwan, Ashima Arts; maintained by Stefan Gustavson. MIT.
// https://github.com/stegu/webgl-noise/blob/master/src/noise2D.glsl
vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec3 permute(vec3 x) { return mod289(((x * 34.0) + 10.0) * x); }
float snoise(vec2 v) {
  const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
  vec2 i = floor(v + dot(v, C.yy));
  vec2 x0 = v - i + dot(i, C.xx);
  vec2 i1 = x0.x > x0.y ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
  vec4 x12 = x0.xyxy + C.xxzz;
  x12.xy -= i1;
  i = mod289(i);
  vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));
  vec3 m = max(0.5 - vec3(dot(x0, x0), dot(x12.xy, x12.xy), dot(x12.zw, x12.zw)), 0.0);
  m = m * m; m = m * m;
  vec3 x = 2.0 * fract(p * C.www) - 1.0;
  vec3 h = abs(x) - 0.5;
  vec3 ox = floor(x + 0.5);
  vec3 a0 = x - ox;
  m *= 1.79284291400159 - 0.85373472095314 * (a0 * a0 + h * h);
  vec3 g;
  g.x = a0.x * x0.x + h.x * x0.y;
  g.yz = a0.yz * x12.xz + h.yz * x12.yw;
  return 130.0 * dot(m, g);
}`;
const VERT = `
attribute vec2 aPosition;
varying vec2 vScreenUv;
void main() {
  vScreenUv = aPosition;
  gl_Position = vec4(aPosition.x * 2.0 - 1.0, 1.0 - aPosition.y * 2.0, 0.0, 1.0);
}`;
const FRAG = `
precision highp float;
uniform sampler2D uTexture;
uniform vec2 uViewport;
uniform vec4 uRect;
uniform vec2 uImageSize;
uniform vec2 uPointer;
uniform float uCurlStrength;
uniform float uHover;
varying vec2 vScreenUv;
${SNOISE}
void main() {
  // гнём экран до перевода в координаты окна, иначе у окна останутся четыре прямых края
  vec2 screenUv = vScreenUv;
  float centeredX = screenUv.x * 2.0 - 1.0;
  float edgeProfile = 1.0 - sqrt(max(0.0, 1.0 - centeredX * centeredX));
  screenUv.y = 0.5 + (screenUv.y - 0.5) * (1.0 - edgeProfile * uCurlStrength);
  vec2 localUv = (screenUv * uViewport - uRect.xy) / uRect.zw;
  vec2 edgePx = min(localUv, 1.0 - localUv) * uRect.zw;
  float mask = smoothstep(0.0, 0.75, min(edgePx.x, edgePx.y));
  if (mask <= 0.0) discard;

  // object-fit: cover, как у картинки в вёрстке
  vec2 uv = localUv;
  float aspect = uRect.z / max(uRect.w, 1.0);
  float imageAspect = uImageSize.x / max(uImageSize.y, 1.0);
  if (imageAspect > aspect) uv.x = 0.5 + (uv.x - 0.5) * aspect / imageAspect;
  else uv.y = 0.5 + (uv.y - 0.5) * imageAspect / aspect;

  // под курсором зернистая рябь, вокруг самого курсора чистое пятно
  float circle = 1.0 - length((localUv - uPointer) * vec2(1.0, 1.0 / aspect)) * 15.0;
  float pointerDistancePx = length((localUv - uPointer) * uRect.zw);
  float focusMask = smoothstep(14.0, 48.0, pointerDistancePx);
  float displacement = circle * snoise(gl_FragCoord.xy) * 0.0028 * uHover * focusMask;
  // у bybang фото прямоугольные; у нас окна вырезаны с прозрачностью, и рябь рвала бы контур.
  // Поэтому силуэт берём из точки без сдвига, а рябь только внутри
  vec4 base = texture2D(uTexture, clamp(uv, 0.0, 1.0));
  vec4 moved = texture2D(uTexture, clamp(uv + vec2(displacement, -displacement), 0.0, 1.0));
  gl_FragColor = vec4(mix(base.rgb, moved.rgb, moved.a), base.a * mask);
}`;

function makeWarp(canvas) {
  const gl = canvas.getContext('webgl', { alpha: true, antialias: false, premultipliedAlpha: true });
  if (!gl) return null;
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return gl.getShaderParameter(s, gl.COMPILE_STATUS) ? s : (console.error(gl.getShaderInfoLog(s)), null); };
  const vs = sh(gl.VERTEX_SHADER, VERT), fs = sh(gl.FRAGMENT_SHADER, FRAG);
  if (!vs || !fs) return null;
  const prog = gl.createProgram();
  gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return null;
  gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, 0, 1, 0, 0, 1, 1, 1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'aPosition');
  gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const u = Object.fromEntries(['uViewport', 'uRect', 'uImageSize', 'uPointer', 'uCurlStrength', 'uHover', 'uTexture'].map(n => [n, gl.getUniformLocation(prog, n)]));
  gl.uniform1i(u.uTexture, 0);
  gl.clearColor(0, 0, 0, 0);
  gl.enable(gl.BLEND);
  gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA, gl.ONE, gl.ONE_MINUS_SRC_ALPHA);

  const textures = new Map();
  function texture(img) {
    let t = textures.get(img.src);
    if (t) return t;
    t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T].forEach(p => gl.texParameteri(gl.TEXTURE_2D, p, gl.CLAMP_TO_EDGE));
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
    t.w = img.naturalWidth; t.h = img.naturalHeight;
    textures.set(img.src, t);
    return t;
  }

  return function draw(items) {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    const W = Math.round(innerWidth * dpr), H = Math.round(innerHeight * dpr);
    if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; }
    gl.viewport(0, 0, W, H);
    gl.uniform2f(u.uViewport, innerWidth, innerHeight);
    gl.disable(gl.SCISSOR_TEST); gl.clear(gl.COLOR_BUFFER_BIT); gl.enable(gl.SCISSOR_TEST);
    for (const it of items) {
      const r = it.rect, t = texture(it.img);
      // рисуем только полосу вокруг окна: запас по вертикали на изгиб
      const pad = innerHeight * 0.5 * it.curl / (1 - it.curl) + 2;
      const x0 = Math.max(0, Math.floor(r.left * dpr)), x1 = Math.min(W, Math.ceil(r.right * dpr));
      const y0 = Math.max(0, Math.floor((innerHeight - r.bottom - pad) * dpr)), y1 = Math.min(H, Math.ceil((innerHeight - r.top + pad) * dpr));
      gl.scissor(x0, y0, Math.max(0, x1 - x0), Math.max(0, y1 - y0));
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, t);
      gl.uniform4f(u.uRect, r.left, r.top, r.width, r.height);
      gl.uniform2f(u.uImageSize, t.w, t.h);
      gl.uniform2f(u.uPointer, it.pointer.x, it.pointer.y);
      gl.uniform1f(u.uCurlStrength, it.curl);
      gl.uniform1f(u.uHover, it.hover);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }
    return gl.getError() === gl.NO_ERROR;
  };
}

function startScroll() {
  // плавность как у Lenis: lerp 0.1, то есть за кадр 60 fps проходим 10% оставшегося пути
  const LERP = reduce ? 1 : 0.1;
  let target = 0, current = 0, last = performance.now(), lastPos = 0, curl = 0;

  addEventListener('wheel', e => {
    const k = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? innerHeight : 1;
    target += (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY) * k;
  }, { passive: true });
  let touch = null;
  addEventListener('touchstart', e => { const t = e.touches[0]; touch = { x: t.clientX, y: t.clientY }; }, { passive: true });
  addEventListener('touchmove', e => {
    if (!touch) return;
    const t = e.touches[0], dx = touch.x - t.clientX, dy = touch.y - t.clientY;
    target += Math.abs(dx) > Math.abs(dy) ? dx : dy;
    touch = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  addEventListener('touchend', () => { touch = null; });
  addEventListener('keydown', e => {
    const step = { ArrowRight: 1, ArrowDown: 1, PageDown: 3, ArrowLeft: -1, ArrowUp: -1, PageUp: -3 }[e.key];
    if (step) target += step * innerWidth * 0.15;
  });

  // наведение: у каждого окна своё значение 0..1 и своя точка курсора, всё с затуханием
  const hoverable = matchMedia('(hover: hover) and (pointer: fine)').matches;
  let px = -1e3, py = -1e3;
  if (hoverable) {
    addEventListener('pointermove', e => { px = e.clientX; py = e.clientY; }, { passive: true });
    document.addEventListener('pointerleave', () => { px = py = -1e3; });
  }
  const state = new WeakMap();

  const canvas = document.getElementById('warp');
  const draw = reduce ? null : makeWarp(canvas);
  if (draw) document.body.classList.add('gl'); else canvas.remove();
  const wins = [...rail.querySelectorAll('.win')];
  window.warpDebug = () => ({ target, current, curl });

  (function frame(now) {
    const dt = Math.min(100, Math.max(1, now - last)); last = now;
    current += (target - current) * (1 - Math.pow(1 - LERP, dt / 16.67));
    if (Math.abs(target - current) < 0.05) current = target;
    // второй набор окон стоит ровно на ширину экрана правее, поэтому круг замыкается на innerWidth
    const P = innerWidth;
    const shift = ((current % P) + P) % P;
    rail.style.transform = `translate3d(${-shift}px, 0, 0)`;

    // скорость в пикселях в секунду → сила изгиба: 800 px/с дают максимум, нарастает за 25 мс, спадает за 175 мс
    const speed = Math.abs(current - lastPos) / dt * 1000; lastPos = current;
    const goal = Math.min(speed / 800, 1);
    curl += (goal - curl) * (1 - Math.exp(-dt / (goal > curl ? 25 : 175)));

    if (draw) {
      const items = [];
      for (const w of wins) {
        const img = w.querySelector('img'), r = w.querySelector('.float').getBoundingClientRect();
        if (r.right < 0 || r.left > innerWidth || r.width < 2) continue;
        let s = state.get(w);
        if (!s) state.set(w, s = { hover: 0, pointer: { x: 0.5, y: 0.5 }, aim: { x: 0.5, y: 0.5 } });
        const inside = px >= r.left && px <= r.right && py >= r.top && py <= r.bottom;
        s.hover += ((inside ? 1 : 0) - s.hover) * (1 - Math.exp(-dt / 150));
        if (inside) s.aim = { x: (px - r.left) / r.width, y: (py - r.top) / r.height };
        const k = 1 - Math.pow(0.84, dt / 16.67);
        s.pointer.x += (s.aim.x - s.pointer.x) * k; s.pointer.y += (s.aim.y - s.pointer.y) * k;
        items.push({ img, rect: r, curl: 0.0486 * curl, hover: s.hover, pointer: s.pointer });
      }
      if (!draw(items)) document.body.classList.remove('gl');
    }
    requestAnimationFrame(frame);
  })(performance.now());
}
</script>
</body>
</html>
