<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mono design · тестовое adelt.io</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #FEFEFE; }
  .hero { position: fixed; inset: 0; }
  .hero img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 100%; display: block; }
  @media (max-width: 900px) { .hero img { object-position: 50% 100%; } }
</style>
</head>
<body>
<main class="hero">
  <img src="assets/hero-photo.jpg" alt="Рим: крыши и купол собора Святого Петра под светлым небом">
</main>
</body>
</html>
