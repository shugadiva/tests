<script>
// Финал по макету 4041:5 (1920×1080): четыре окна вокруг подписи.
// [центр x в % ширины, центр y в % высоты, высота в --u (1080 = 100), окно, ширина/высота рамки в макете]
const WINDOWS = {
  shutters: 'win-shutters-on.webp', arch: 'win-arch-on.webp', tiles: 'win-tiles-on.webp',
};
const LAYOUT = matchMedia('(orientation: portrait)').matches
  ? [ // телефон: макета нет, два окна сверху и два снизу, подпись в просвете
      [27, 20, 31.48, 'shutters', '300 / 340'], [74, 25, 31.20, 'arch', '300 / 337'],
      [26, 76, 36.48, 'tiles', '270 / 394'], [73, 81, 31.48, 'shutters', '300 / 340'],
    ]
  : [
      [32.66, 22.69, 31.48, 'shutters', '300 / 340'], [80.42, 24.49, 31.20, 'arch', '300 / 337'],
      [14.53, 68.24, 36.48, 'tiles', '270 / 394'], [68.80, 77.41, 31.48, 'shutters', '300 / 340'],
    ];
const START_H = 30.93;       // высота главного окна на загрузке, в --u: в макете 4041:2 окно 200×334 на 1080 по высоте
const EASE = 'cubic-bezier(0.16, 1, 0.3, 1)';

const sky = document.getElementById('sky');
const rail = document.getElementById('rail');
const counter = document.getElementById('counter');
const city = document.querySelector('.city');
const wordmark = document.getElementById('wordmark');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

function makeWin([x, y, h, type, ar], cls, parent = rail) {
  const el = document.createElement('div');
  el.className = `win ${type} ${cls}`;
  el.style.left = x + '%'; el.style.top = y + '%'; el.style.setProperty('--h', h); el.style.setProperty('--ar', ar);
  el.style.setProperty('--bob', (5 + Math.random() * 4).toFixed(1) + 's');
  const f = document.createElement('div'); f.className = 'float';
  f.innerHTML = cls === 'main'
    ? '<img class="off" src="assets/win-c-off.webp" alt=""><img class="on" src="assets/win-c-on.webp" alt="">'
    : `<img src="assets/${WINDOWS[type]}" alt="">`;
  el.append(f); parent.append(el); return el;
}
const clones = LAYOUT.map(p => makeWin(p, 'clone'));
LAYOUT.forEach(([x, ...rest]) => makeWin([x + 100, ...rest], 'copy'));   // второй набор правее экрана, для бесшовного круга
const main = makeWin([50, 50, START_H, 'c', '658 / 1100'], 'main', sky);

// трансформация, которая ставит окно в центр экрана в размер главного окна на загрузке
function unit() { return Math.min(innerHeight / 100, innerWidth * (matchMedia('(orientation: portrait)').matches ? 0.015 : 0.0062)); }
function centerTransform(el) {
  const r = el.getBoundingClientRect();
  const s = START_H * unit() / r.height;
  return `translate(${innerWidth / 2 - (r.left + r.width / 2)}px, ${innerHeight / 2 - (r.top + r.height / 2)}px) scale(${s})`;
}
const wait = ms => new Promise(r => setTimeout(r, ms));

async function run() {
  await Promise.all([...document.images].map(i => i.decode().catch(() => {})));

  // ?final: сразу финальный экран, чтобы проверять переход без загрузки
  if (reduce || location.search.includes('final')) {
    main.remove(); document.body.classList.add('idle');
    clones.forEach(c => c.style.opacity = 1);
    city.style.transform = 'none'; wordmark.style.opacity = 1;
    counter.remove(); main.remove(); startScroll(); return;
  }

  // 1. загрузка: главное окно по центру, свет выключен, идёт счётчик
  main.style.opacity = 1;
  main.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 700, easing: 'ease-out' });
  counter.style.top = (innerHeight / 2 + START_H * unit() / 2 + 14) + 'px';   // зазор 14, как в макете

  const LOAD = 2400, t0 = performance.now();
  await new Promise(done => {
    (function tick(now) {
      const p = Math.min(1, (now - t0) / LOAD);
      counter.textContent = Math.round(100 * (1 - Math.pow(1 - p, 2.2)));
      p < 1 ? requestAnimationFrame(tick) : done();
    })(t0);
  });
  await wait(250);
  counter.classList.add('hide');

  // 2. свет загорается: короткое мерцание, как у лампы, потом ровный свет
  const FLICKER = [0, 0.7, 0.05, 0.85, 0.25, 1], OFFS = [0, 0.12, 0.22, 0.45, 0.58, 1];
  const flick = { duration: 900, easing: 'linear', fill: 'forwards' };
  main.querySelector('.off').animate(FLICKER.map((o, i) => ({ opacity: 1 - o, offset: OFFS[i] })), flick);
  await main.querySelector('.on').animate(FLICKER.map((o, i) => ({ opacity: o, offset: OFFS[i] })), flick).finished;
  await wait(350);

  // 3. окно распадается: из главного вылетают четыре окна финала и расходятся по небу, главное гаснет
  clones.forEach(c => {
    const from = centerTransform(c);
    c.animate(
      [{ transform: from, opacity: 0 }, { opacity: 1, offset: 0.2 }, { transform: 'none', opacity: 1 }],
      { duration: 1700, delay: 40 + Math.random() * 260, easing: EASE, fill: 'forwards' });
  });
  main.animate([{ opacity: 1, transform: 'scale(1)' }, { opacity: 0, transform: 'scale(0.92)' }], { duration: 500, easing: 'ease-out', fill: 'forwards' })
    .finished.then(() => main.remove());

  // 4. город выезжает снизу и встаёт на место с лёгкой отдачей
  await wait(500);
  await city.animate(
    [{ transform: 'translateY(100%)' }, { transform: 'translateY(-1.2%)', offset: 0.78 }, { transform: 'translateY(0)' }],
    { duration: 1600, easing: 'cubic-bezier(0.22, 1, 0.36, 1)', fill: 'forwards' }).finished;

  // 5. подпись проявляется по центру
  wordmark.animate([{ opacity: 0, transform: 'translateY(12px)' }, { opacity: 1, transform: 'none' }], { duration: 900, easing: EASE, fill: 'forwards' });
  document.body.classList.add('idle');
  startScroll();
}

// Переход в комнату по клику на окно.
// 1. остальные окна разлетаются и гаснут, выбранное едет в центр и растёт;
// 2. в его проёме снизу вырастает колонна паттерна, сквозь неё видна комната;
// 3. камера наезжает: окно проходит мимо, колонна становится шире экрана, мы в комнате.
const COLUMN = 'M0.64 18.76V0H53.76V18.76C51.2 21.19 49.92 25.22 49.92 30.87V394.06C49.92 402.53 51.41 408.39 54.4 411.61V435.2H0V411.61C2.99 408.39 4.48 402.53 4.48 394.06V30.87C4.48 25.22 3.2 21.19 0.64 18.76Z';
const COL_W = 54.4, COL_H = 435.2, SHAFT_W = 45.44, SHAFT_H = 363.2;   // ствол колонны без капители и базы
const portal = document.getElementById('portal');
const doorShape = document.getElementById('doorShape'), doorRim = document.getElementById('doorRim'), room = document.getElementById('room');
doorShape.setAttribute('d', COLUMN); doorRim.setAttribute('d', COLUMN);

const lerp = (a, b, p) => a + (b - a) * p;
const clamp01 = p => Math.max(0, Math.min(1, p));
const easeOut = p => 1 - Math.pow(1 - p, 4);
const easeInOut = p => p < 0.5 ? 4 * p ** 3 : 1 - Math.pow(-2 * p + 2, 3) / 2;   // cubic in-out: разгон в окно и мягкая посадка в комнате

sky.addEventListener('click', e => {
  const win = e.target.closest('.rail .win');   // оба набора ленты, и основной, и копия для круга
  if (win && document.body.classList.contains('idle')) enterRoom(win);
});

function enterRoom(win) {
  document.body.classList.remove('idle'); document.body.classList.add('leaving');
  // лента и холст изгиба замирают: окна дальше двигает переход, а рисует их обычная вёрстка
  scrollFrozen = true; document.body.classList.remove('gl'); document.getElementById('warp').style.display = 'none';
  const W = innerWidth, H = innerHeight, cx = W / 2, cy = H / 2;
  room.setAttribute('width', W); room.setAttribute('height', H);

  if (reduce) { doorShape.setAttribute('d', `M0 0H${W}V${H}H0Z`); portal.style.visibility = 'visible'; portal.animate([{ opacity: 0 }, { opacity: 1 }], 600); return; }

  // остальные окна уходят от выбранного, подпись гаснет, город темнеет
  // анимация входа держит transform окна через fill: forwards, снимаем её, иначе инлайновый transform не применится
  win.getAnimations().forEach(an => { an.commitStyles(); an.cancel(); });
  const r = win.getBoundingClientRect(), wx = r.left + r.width / 2, wy = r.top + r.height / 2;
  [...rail.querySelectorAll('.win')].filter(c => c !== win).forEach(c => {
    const q = c.getBoundingClientRect(), dx = q.left + q.width / 2 - wx, dy = q.top + q.height / 2 - wy, d = Math.hypot(dx, dy) || 1;
    c.animate([{ transform: 'none', opacity: 1 }, { transform: `translate(${dx / d * W * 0.25}px, ${dy / d * H * 0.25}px) scale(0.9)`, opacity: 0 }],
      { duration: 1000, easing: 'cubic-bezier(0.5, 0, 0.75, 0)', fill: 'forwards' });
  });
  wordmark.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 400, fill: 'forwards' });
  city.querySelector('img').animate([{ filter: 'brightness(1)' }, { filter: 'brightness(0.55)' }], { duration: 1600, fill: 'forwards' });

  const s1 = Math.min(H * 0.62 / r.height, W * 0.8 / r.width);   // окно в центре: 62% высоты экрана, на телефоне не шире 80%
  const k = r.height * s1 * 0.66 / COL_H;         // колонна-дверь: 66% высоты окна, низ не заходит на подоконник
  const zEnd = 1.15 * Math.max(W / (SHAFT_W * k), H / (SHAFT_H * k));   // ствол колонны перекрывает экран с запасом
  const A = 900, B0 = 550, B = 700, C0 = 1000, C = 2100;   // мс: окно в центр, дверь растёт, наезд

  portal.style.visibility = 'visible';
  const t0 = performance.now();
  (function frame(now) {
    const t = now - t0;
    const a = easeOut(clamp01(t / A));
    const g = easeOut(clamp01((t - B0) / B));
    const c = easeInOut(clamp01((t - C0) / C));
    const z = Math.pow(zEnd, c);             // наезд по экспоненте: скорость приближения кажется ровной

    // окно: в центр и крупнее, потом проходит мимо камеры
    const ws = lerp(1, s1, a) * z;
    win.style.transform = `translate(${lerp(0, cx - wx, a)}px, ${lerp(0, cy - wy, a)}px) scale(${ws})`;
    win.style.opacity = 1 - clamp01((z - 2.5) / 3);

    // дверь стоит на подоконнике центра окна и растёт вверх, на наезде масштабируется вокруг центра экрана
    const S = k * Math.max(g, 0.001) * z;
    const bottom = cy + (COL_H * k / 2) * z;
    const doorCy = bottom - COL_H * S / 2;
    const m = `translate(${cx} ${doorCy}) scale(${S}) translate(${-COL_W / 2} ${-COL_H / 2})`;
    doorShape.setAttribute('transform', m); doorRim.setAttribute('transform', m);
    doorRim.style.opacity = 1 - c;
    // комната внутри почти неподвижна, как фото в арке era: только оседает с 1.12 до 1
    const rs = lerp(1.12, 1, c);
    room.setAttribute('transform', `translate(${cx} ${cy}) scale(${rs}) translate(${-cx} ${-cy})`);

    if (t < C0 + C) requestAnimationFrame(frame);
    else { doorShape.setAttribute('transform', ''); doorShape.setAttribute('d', `M0 0H${W}V${H}H0Z`); doorRim.remove(); sky.remove(); }
  })(t0);
}
